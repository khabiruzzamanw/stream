  <style>
    /* ── PLAY PAGE — full-screen player ── */

    * { box-sizing: border-box; }

    body {
      background: #000;
      width: 100%; height: 100vh;
      overflow: hidden;
      color: #f0ede6;
      user-select: none; -webkit-user-select: none;
      /* override main style.css body */
      margin: 0;
    }

    /* grain stays but lighter */
    body::after { opacity: 0.015; }

    /* ── Custom cursor (desktop) ── */
    .cursor, .cursor-ring {
      position: fixed; border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cursor {
      width: 7px; height: 7px;
      background: var(--accent, #c9a86c);
      transition: transform 0.1s, width 0.2s, height 0.2s;
    }
    .cursor-ring {
      width: 30px; height: 30px;
      border: 1px solid rgba(201,168,108,0.4);
      transition: transform 0.12s ease-out, width 0.2s, height 0.2s;
    }
    @media (hover: hover)  { body { cursor: none; } }
    @media (hover: none)   { .cursor, .cursor-ring { display: none; } }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 5.5rem; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(13,12,10,0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(201,168,108,0.25);
      color: #f0ede6;
      font-family: 'Syne', sans-serif;
      font-size: 0.76rem; letter-spacing: 0.06em;
      padding: 0.45rem 1.2rem; border-radius: 3rem;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none; z-index: 500;
      white-space: nowrap; max-width: 90vw;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Player wrap ── */
    #playerWrap {
      position: relative; width: 100%; height: 100vh; background: #000;
    }

    #stream {
      position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
    }
    #stream iframe {
      width: 100%; height: 100%; border: none; display: block;
    }

    /* ── Controls overlay ── */
    #controls {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      opacity: 1; transition: opacity 0.5s ease; pointer-events: none;
    }
    #controls.hidden { opacity: 0; }
    .ctrl-top, .ctrl-bottom { pointer-events: all; }
    .ctrl-middle { flex: 1; pointer-events: none; }
    #controls.hidden .ctrl-top,
    #controls.hidden .ctrl-bottom { pointer-events: none; }

    /* ── TOP BAR ── */
    .ctrl-top {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, transparent 100%);
      gap: 1rem;
    }

    .back-btn {
      display: flex; align-items: center; gap: 0.5rem;
      color: rgba(240,237,230,0.55);
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      font-weight: 600;
      transition: color 0.2s; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn:hover { color: #f0ede6; }

    .back-circle {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(240,237,230,0.2);
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .back-btn:hover .back-circle {
      border-color: var(--accent, #c9a86c);
      background: rgba(201,168,108,0.15);
    }
    .back-circle svg { width: 12px; height: 12px; }

    .ctrl-title {
      font-family: 'Instrument Serif', serif;
      font-style: italic; font-size: 0.95rem; font-weight: 400;
      letter-spacing: -0.01em;
      color: rgba(240,237,230,0.6);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 40%; text-align: center;
    }

    /* Source switcher */
    .source-switcher {
      display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0;
    }
    .source-label {
      font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(240,237,230,0.4); margin-right: 0.2rem;
      font-family: 'Syne', sans-serif; font-weight: 600;
    }
    .source-btn {
      min-width: 34px; height: 34px; padding: 0 0.65rem;
      border-radius: 2rem;
      font-size: 0.7rem; font-family: 'Syne', sans-serif;
      font-weight: 600; letter-spacing: 0.05em;
      color: rgba(240,237,230,0.45);
      background: rgba(240,237,230,0.07);
      border: 1px solid rgba(240,237,230,0.1);
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .source-btn:hover,
    .source-btn.active {
      background: rgba(201,168,108,0.18);
      border-color: rgba(201,168,108,0.45);
      color: #c9a86c;
    }

    /* ── BOTTOM BAR ── */
    .ctrl-bottom {
      padding: 1.5rem 2rem 2rem;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
    }

    .ctrl-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 1rem;
    }

    .ctrl-left-group,
    .ctrl-right-group {
      display: flex; align-items: center; gap: 0.55rem;
    }

    /* Icon buttons */
    .ctrl-btn {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(240,237,230,0.07);
      border: 1px solid rgba(240,237,230,0.1);
      border-radius: 50%; color: rgba(240,237,230,0.55);
      cursor: pointer; transition: all 0.2s;
      backdrop-filter: blur(12px);
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .ctrl-btn svg { width: 15px; height: 15px; }
    .ctrl-btn:hover {
      background: rgba(240,237,230,0.13);
      border-color: rgba(240,237,230,0.22);
      color: #f0ede6;
    }
    .ctrl-btn.accent-btn:hover {
      background: rgba(201,168,108,0.18);
      border-color: rgba(201,168,108,0.4);
      color: #c9a86c;
    }

    /* Fullscreen pill */
    .ctrl-btn.fullscreen-btn {
      border-radius: 3rem; width: auto;
      padding: 0 1rem; gap: 0.4rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
    }

    /* Volume */
    .volume-wrap {
      display: flex; align-items: center; gap: 0.5rem;
    }
    .volume-label {
      font-size: 0.65rem; color: rgba(240,237,230,0.4);
      width: 2rem; text-align: right;
      font-family: 'Syne', sans-serif;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 80px; height: 2px;
      background: rgba(240,237,230,0.15);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px; border-radius: 50%;
      background: #c9a86c; cursor: pointer;
      transition: transform 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

    /* ── MOBILE ── */
    @media (hover: none), (max-width: 600px) {
      .volume-wrap { display: none; }
      .source-label { display: none; }
      #fsLabel { display: none; }

      .ctrl-top { padding: 0.8rem 1rem; gap: 0.6rem; }
      .ctrl-title { max-width: 35%; font-size: 0.82rem; }
      .back-btn span:last-child { display: none; }
      .back-circle { width: 40px; height: 40px; }
      .source-btn { min-width: 40px; height: 40px; border-radius: 0.7rem; font-size: 0.8rem; }
      .ctrl-bottom { padding: 0.8rem 1rem 1.2rem; }
      .ctrl-btn { width: 50px; height: 50px; border-radius: 50%; }
      .ctrl-btn svg { width: 18px; height: 18px; }
      .ctrl-btn.fullscreen-btn { width: 50px; padding: 0; border-radius: 50%; }
      .ctrl-row { justify-content: center; gap: 0.9rem; }
      .ctrl-left-group { gap: 0.7rem; }
      .ctrl-right-group { gap: 0.7rem; }
    }
  </style>
</head>
