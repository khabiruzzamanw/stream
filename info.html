<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="info.js"></script>
    <title>stream/info</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --accent-color: #5c7e8f;
            --card-color: #d4dde290;
            --button-color: #ffffff;
            --glass-effect-color: rgba(255, 255, 255, 0);
            --border-color: rgba(255, 255, 255, 0.15);
            --font-color: #111111;
            --box-shadow-color: #a2a2a220;
        }


        .dark {
            --bg-color: #111111;
            --accent-color: rgba(255, 255, 255, 0.15);
            --card-color: #22222290;
            --button-color: #111111;
            --glass-effect-color: rgba(255, 255, 255, 0);
            --border-color: rgba(255, 255, 255, 0.15);
            --font-color: #ffffff;
            --box-shadow-color: #a2a2a220;
        }

        * {
            padding: 0;
            margin: 0;
            border: none;
            list-style: none;
            outline: none;
            text-decoration: none;
        }

        html {
            scroll-behavior: smooth;
        }

        img {
            max-width: 100%;
            object-fit: cover;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--font-color);
            line-height: 1.6;
            background-color: var(--bg-color);
        }

main {
    position: relative;
    min-height: 100vh;
    width: 100%;
    overflow: hidden;
    --bg-image: none;
}

/* Background Image Layer */
main::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center center; /* changed from top center */
    background-repeat: no-repeat;
    z-index: 0;
}

/* Make the gradient stronger to blend better */
main::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, 
        rgba(0, 0, 0, 0.3) 0%, 
        rgba(0, 0, 0, 0.6) 50%, 
        rgba(0, 0, 0, 0.95) 100%);
    z-index: 1;
}

.moviePage {
    position: absolute;
    bottom:2rem;
    z-index: 2;
    max-height: 100vh;
    display: flex;
    align-items: flex-end; /* pushes content to bottom */
    padding:0 0 0  2rem ;
}

.movieInfo {
    /* Remove absolute positioning */
    max-width: 100%;
    color: #ffffff;
    display:flex;
    gap:2rem;
    flex-direction: column;
}

.movieStat {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 2rem;
    border-radius: 12px;
    color: #ffffff;
    display:flex;
    flex-direction: column;
}

.movieStat p {
    color: #ffffff;
    margin-bottom: 0.5rem;
    font-size: 1rem;
}

.genreDiv{
    display:flex;
    column-gap: 1rem;
    /* flex-direction: column; */
}

.genreDiv p {
    padding:0.5rem;
    border:1px solid var(--border-color);
    border-radius:0.5rem;
}
    </style>
</head>

<body class="light">
    <main class="mainPage" id="mainPage">
        <section class="moviePage" id="moviePage">

            <div class="movieInfo" id="movieInfo">
                <div class="movieStat" id="movieStat">

                </div>

                <div class="movieButtons" id="movieButtons">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
