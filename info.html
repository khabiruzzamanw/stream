<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script type="module" src="info.js"></script>
    <title>stream / info</title>
    <style>
        :root {
            --bg-color: white;
            --container-color: rgb(200, 200, 200);
            --card-color: rgb(180, 180, 180);
            --font-color: black;
            --accent-color: rgb(0, 140, 255);
            --shadow-color: rgba(250, 250, 250, 0.9);
            --border-color: rgba(126, 126, 126, 0.8);
            --button-color: rgb(50, 50, 50);
            --glass-color: rgba(0, 0, 0, 0.15);
            --info-shadow-color: rgba(255, 255, 255, 0.8);



        }

        .dark {
            --bg-color: black;
            --container-color: rgb(30, 30, 30);
            --card-color: rgb(60, 60, 60);
            --font-color: white;
            --accent-color: rgb(255, 0, 0);
            --shadow-color: rgba(10, 10, 10, 0.9);
            --border-color: rgba(126, 126, 126, 0.8);
            --button-color: rgb(200, 200, 200);
            --info-shadow-color: rgba(0, 0, 0, 0.8);
        }

        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            border: none;
            list-style: none;
            outline: none;
            text-decoration: none;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        img {
            max-width: 100%;
            object-fit: contain;
            display: block;
        }


        body {
            width: 100%;
            min-height: 100vh;
            font-family: sans-serif;
            color: var(--font-color);
            background-color: var(--bg-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        main {
            --bg-image: none;
            width: 100%;
            min-height: 100vh;
            position: relative;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
        }

        main::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--bg-image);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            z-index: 0;
        }

        main::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top right, var(--info-shadow-color) 10%, transparent 50%);
            z-index: 1;
        }

        main>* {
            position: relative;
            z-index: 2;
        }

        .exit {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.5rem;
            border-radius: 50%;
            background-color: var(--glass-color);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
        }

        .exitImage {
            width: 1.5rem;
        }

        .movieInfo {
            width: fit-content;
            /* background-color: var(--glass-color);
            backdrop-filter: blur(10px); */
            padding: 1rem 2rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            /* justify-content: flex-start;
            align-items: flex-start; */
        }

        .movieButtons {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            column-gap: 1rem;
        }

        .movieButtons a {
            display: flex;
            column-gap: 0.5rem;
            padding: 0.25rem 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background-color: var(--glass-color);
            backdrop-filter: blur(5px);
            color: var(--font-color);
        }

        .movieButtons a img {
            width: 1rem;
            /* object-fit: contain; */
        }

        .movieStat {
            width: 100%;
            display: flex;
            flex-direction: column;
            row-gap: 1rem;
        }

        .movieTiming {
            width: 100%;
            display: flex;
            /* justify-content: flex-start;
            align-items: flex-start; */
            column-gap: 1rem;
        }

        .movieTiming div {
            display: Flex;
            justify-content: center;
            align-items: center;
            column-gap: 0.25rem;
        }

        .movieTitleDiv {
            width: 100%;
            display: flex;
            flex-direction: column;
            line-height: normal;
            /* justify-content: center;
            align-items: center; */
        }

        .movieTitle {
            font-family: Cinzel, sans-serif;
            font-weight: 600;
            font-size: 4rem;

        }

        .movieTagLine {
            font-family: Raleway, sans-serif;
            font-weight: 500;
            font-size: 1.25rem;
        }

        .genreDiv {
            display: flex;
            column-gap: 1rem;
        }

        .genreDiv p {
            padding: 0.25rem 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
        }

        .overView {
            width: 30%;
        }

        .costCollection {
            display: flex;
            column-gap: 1rem;
        }

        .akaTitleDiv {
            display: flex;
            column-gap: 0.25rem;
        }

        .akaBar {
            width: 0.2rem;
            background-color: var(--accent-color);
            border-radius: 0.5rem;
        }

        .akaTitle {
            display: flex;
            flex-direction: column;
        }

        .akaTitle span:nth-child(1) {
            font-size: 1rem;
            opacity: 0.6;
        }

        .akaTitle span:nth-child(2) {
            font-size: 1.25rem;
            font-family: Raleway, sans-serif;
            font-weight: 600;
        }
    </style>
</head>

<body class="light">

    <main>
        <a href="index.html" class="exit" id="exit"><img src="images/returnLight.png" alt="" class="exitImage"
                id="exitImage"></a>
        <section class="movieInfo" id="movieInfo">

            <div class="movieButtons" id="movieButtons">

            </div>
            <div class="movieStat" id="movieStat">

            </div>

        </section>
    </main>
</body>

</html>
